<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>幾貓</title>
<style>
  :root { --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px); }
  html, body { height: 100%; margin: 0; background: #14161a; color: #e8e6e1;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    -webkit-text-size-adjust: 100%; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%;
    padding: calc(24px + var(--sat)) 22px calc(24px + var(--sab)); box-sizing: border-box; }
  #box { width: 100%; max-width: 340px; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .22em; margin: 0 0 8px; color: #8f959d; }
  .sub { font-size: 12px; color: #565c64; margin: 0 0 28px; letter-spacing: .04em; }
  label { display: block; font-size: 11px; color: #6b727a; letter-spacing: .12em; margin: 0 0 7px; }
  input { width: 100%; box-sizing: border-box; padding: 14px 15px; font-size: 16px;
    background: #1c1f25; border: 1px solid #2a2f36; border-radius: 7px; color: #e8e6e1;
    outline: none; margin-bottom: 16px; }
  input:focus { border-color: #4d545c; background: #1f2229; }
  button { width: 100%; margin-top: 8px; padding: 15px; font-size: 15px;
    background: #e8e6e1; color: #14161a; border: 0; border-radius: 7px;
    font-weight: 600; letter-spacing: .12em; cursor: pointer; }
  button:disabled { opacity: .38; cursor: default; }
  #msg { margin-top: 18px; font-size: 13px; color: #878d95; min-height: 40px; line-height: 1.65; }
  #msg.bad { color: #c8796c; }
  #bar { margin-top: 16px; height: 1px; background: #2a2f36; opacity: 0; transition: opacity .25s; }
  #bar.on { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="box">
    <h1>幾 貓</h1>
    <p class="sub">以 SealNote 帳號進入</p>
    <label for="u">帳號</label>
    <input id="u" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username">
    <label for="p">密碼</label>
    <input id="p" type="password" autocomplete="current-password">
    <button id="go">進 入</button>
    <div id="bar"></div>
    <div id="msg"></div>
  </div>
</div>
<script>
var API = "https://sealnote-api.mgjack13.workers.dev";
var ITER = 130000;

var msg = document.getElementById("msg");
var bar = document.getElementById("bar");
var btn = document.getElementById("go");
var uEl = document.getElementById("u");
var pEl = document.getElementById("p");

function say(t, bad) { msg.textContent = t; msg.className = bad ? "bad" : ""; }

function b64ToBytes(b64) {
  var pad = b64.length % 4 ? 4 - (b64.length % 4) : 0;
  var s = atob(b64 + "=".repeat(pad));
  var a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

async function run() {
  var u = uEl.value.trim();
  var p = pEl.value;
  if (!u || !p) { say("帳號和密碼都要填。", true); return; }

  btn.disabled = true; bar.className = "on"; say("驗證中…");

  // 1. 先向 SealNote 後端驗證，這是真的鎖
  var res;
  try {
    res = await fetch(API + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
  } catch (e) {
    btn.disabled = false; bar.className = "";
    say("連不上驗證伺服器，檢查網路後重試。", true); return;
  }

  if (res.status === 401) {
    btn.disabled = false; bar.className = "";
    say("帳號或密碼不對。", true); return;
  }
  if (!res.ok) {
    btn.disabled = false; bar.className = "";
    say("驗證失敗（" + res.status + "）。", true); return;
  }

  // 2. 同一組密碼解開密文。就算有人繞過驗證，沒有密碼也拿不到內容
  try {
    say("解密中…");
    var keyMeta = await (await fetch("g.key", { cache: "no-store" })).text();
    var lines = keyMeta.trim().split(/\r?\n/);
    var salt = b64ToBytes(lines[0]);
    var nonce = b64ToBytes(lines[1]);

    var km = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

    var buf = await (await fetch("g.bin", { cache: "no-store" })).arrayBuffer();
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, buf);
    var txt = new TextDecoder().decode(plain);

    document.open(); document.write(txt); document.close();
  } catch (e) {
    btn.disabled = false; bar.className = "";
    say("檔案解密失敗，可能 g.bin / g.key 不完整，或密碼已改過需要重新打包。", true);
  }
}

btn.onclick = run;
pEl.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
uEl.addEventListener("keydown", function (e) { if (e.key === "Enter") pEl.focus(); });
</script>
</body>
</html>
